    <!-- Set the theme before first paint so the page never flashes the wrong one -->
    <script>
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('builtby-theme'); } catch (e) {}
        var theme = saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = theme;
      })();
    </script>
